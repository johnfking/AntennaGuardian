name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AntennaGuardian.sln

      - name: Test
        run: dotnet test .\AntennaGuardian.sln -c Release --no-restore

      - name: Publish Windows executable
        run: >-
          dotnet publish .\src\AntennaGuardian.App\AntennaGuardian.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AntennaGuardian-win-x64
          path: .\dist\AntennaGuardian.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: AntennaGuardian-win-x64
          path: .\dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          .\dist\AntennaGuardian.exe
          --verify-tag
          --generate-notes
          --title "AntennaGuardian ${{ github.ref_name }}"
