name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AntennaGuardian.sln

      - name: Test
        run: dotnet test .\AntennaGuardian.sln -c Release --no-restore

      - name: Publish Windows executable
        run: >-
          dotnet publish .\src\AntennaGuardian.App\AntennaGuardian.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\dist

      - name: Resolve package version
        id: package-version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AntennaGuardian.App\AntennaGuardian.App.csproj
          $version = (Select-Xml -Xml $project -XPath '/Project/PropertyGroup/Version' |
            Select-Object -First 1).Node.InnerText.Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match project version $version."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Smoke-test standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\smoke | Out-Null
          Copy-Item .\dist\AntennaGuardian.exe .\smoke\AntennaGuardian.exe
          $process = Start-Process .\smoke\AntennaGuardian.exe -ArgumentList '--preview' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Standalone executable exited during preview startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id

      - name: Upload unsigned artifact for SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: AntennaGuardian-unsigned-${{ github.run_id }}
          path: .\dist\AntennaGuardian.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: .\signed

      - name: Verify signed executable
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem .\signed -Recurse -Filter AntennaGuardian.exe)
          if ($signed.Count -ne 1) {
            throw "Expected one signed AntennaGuardian.exe, found $($signed.Count)."
          }
          Copy-Item $signed[0].FullName .\dist\AntennaGuardian.exe -Force
          $signature = Get-AuthenticodeSignature .\dist\AntennaGuardian.exe
          if ($signature.Status -ne 'Valid') {
            throw "SignPath returned an invalid signature: $($signature.StatusMessage)"
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

          $process = Start-Process .\dist\AntennaGuardian.exe -ArgumentList '--preview' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Signed executable exited during preview startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id

      - name: Install Velopack packager
        run: dotnet tool install --tool-path .\.tools vpk --version 1.2.0

      - name: Add distribution notices
        run: Copy-Item .\LICENSE, .\THIRD_PARTY_NOTICES.md .\dist\

      - name: Download previous update package
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .\.tools\vpk download github
          --repoUrl https://github.com/johnfking/AntennaGuardian
          --channel win-x64
          --outputDir .\releases
          --token $env:GH_TOKEN

      - name: Build installer and update packages
        run: >-
          .\.tools\vpk pack
          --packId AntennaGuardian
          --packVersion ${{ steps.package-version.outputs.version }}
          --packDir .\dist
          --mainExe AntennaGuardian.exe
          --packTitle AntennaGuardian
          --packAuthors "John W3JFK"
          --channel win-x64
          --runtime win-x64
          --icon .\src\AntennaGuardian.App\Assets\AntennaGuardian.ico
          --shortcuts StartMenuRoot
          --noPortable
          --outputDir .\releases

      - name: Prepare portable download
        shell: pwsh
        run: |
          Copy-Item .\dist\AntennaGuardian.exe .\releases\AntennaGuardian-portable-win-x64.exe
          Copy-Item .\THIRD_PARTY_NOTICES.md .\releases\THIRD_PARTY_NOTICES.md

      - name: Build Microsoft Store MSIX
        if: vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          .\scripts\build-store-package.ps1 `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME `
            -OutputDirectory .\releases

      - name: Upload Microsoft Store package
        if: vars.STORE_IDENTITY_NAME != '' && vars.STORE_PUBLISHER != '' && vars.STORE_PUBLISHER_DISPLAY_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: AntennaGuardian-store-msix-${{ steps.package-version.outputs.version }}
          path: .\releases\AntennaGuardian-${{ steps.package-version.outputs.version }}-win-x64.msix
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AntennaGuardian-win-x64
          path: |
            .\releases\AntennaGuardian-${{ steps.package-version.outputs.version }}-win-x64-*.nupkg
            .\releases\AntennaGuardian-win-x64-Setup.exe
            .\releases\AntennaGuardian-portable-win-x64.exe
            .\releases\assets.win-x64.json
            .\releases\releases.win-x64.json
            .\releases\RELEASES-win-x64
            .\releases\THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: AntennaGuardian-win-x64
          path: .\release

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem .\release -File |
            Where-Object Name -ne 'SHA256SUMS' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content .\release\SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $signingNote = if ('${{ vars.SIGNPATH_ENABLED }}' -eq 'true') {
            'The AntennaGuardian application executable is Authenticode signed by SignPath Foundation. The Velopack installer and update bootstrap executables are not yet signed.'
          } else {
            'This release is not code-signed and may trigger a Windows SmartScreen warning.'
          }
          gh release create "${{ github.ref_name }}" `
            .\release\* `
            --verify-tag `
            --generate-notes `
            --notes "$signingNote`n`nCode signing policy: https://github.com/johnfking/AntennaGuardian/blob/main/CODE_SIGNING_POLICY.md" `
            --title "AntennaGuardian ${{ github.ref_name }}"
